*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.top{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top b{font-size:1.2rem}.top b span{color:var(--acc)}

nav{max-width:1100px;margin:0 auto;padding:0 16px 8px;display:flex;gap:6px;overflow-x:auto}

main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(1.5rem,4vw,2.2rem);margin:4px 0}
.sub{color:var(--mute);margin:0 0 18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.box{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.box.wide{grid-column:1/-1}
h2{margin:0 0 8px;font-size:1.1rem;color:var(--acc)}
h3{margin:12px 0 6px;font-size:1rem}
a{color:var(--acc)}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;color:var(--mute)}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 10px;margin:1px 2px;font-weight:600;font-size:.88rem;white-space:nowrap}
.G{color:var(--ok)}.Y{color:var(--warn)}.D{color:var(--bad)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.bar button{font:inherit;font-size:.9rem;padding:5px 12px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
.bar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.note{background:var(--chip);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.95rem}
.tip{border-left:4px solid var(--ok)}
.warn{border-left:4px solid var(--bad)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.card h3{margin:0 0 4px}.card small{color:var(--mute)}
ol,ul{margin:6px 0;padding-left:22px}li{margin:4px 0}
.foot{text-align:center;color:var(--mute);font-size:.85rem;margin-top:26px}
.go{display:block;text-decoration:none;color:var(--ink)}.go:hover{border-color:var(--acc)}
</style>

pane(1,box("Cara Leveling & Skill Point Minimal",tbl(["Skill","Cara leveling","SP minimal"],[["Construction","Daun → Bundle → Bundle lagi, atau Boulder → Stone Pillar → Plank → Wall/Floor","Plank, Stone Pillar, Wall/Floor"],["Processing","Log &amp; Branch → Split Log → Nail (sampai Lv40) / Charcoal; Trim &amp; Compress setelah 40","Cut Pillar, Nail, Trim, Process, Compress, Charcoal, Leather Strap, Dry Leather, Refine Ore"],["Cooking","Sembelih daging → Meat Dumpling, ulangi 3x per daging","Make Dumplings"],["Farming","Mud → tanam Flax &amp; Cotton di pulau pribadi","Flax, Cotton, Sugarcane (opsional)"],["Tailor","Flax/Cotton → Thread → Soft Fabric. Paling menyakitkan; simpan Soft Fabric untuk perlengkapan job","Strong Thread, Strong Fabric, Backpack, Mod Pockets"],["Weapon Crafting","Boulder → Stone Plate (sampai Lv30), Mud → Earthenware Pot","Stone Plate, Pot, Handle, Work Hammer/Knife/Axe/Saw"],["Melee / Ranged","Bertarung dengan senjata terkait","Maksimalkan skill senjata pilihan"],["Defense","Bertarung + defense action di kerumunan musuh kecil","Defense Stance, Parry/Roll, semua pasif"],["Butchering","Clam paling cepat &amp; aman; atau sembelih hewan, ambil tulang","Pelt II, Large Leg Bones"],["Gathering","Tak perlu dikhawatirkan, selalu tertinggi","Maks kategori Wood, Searching &amp; Energy"],["Survival","Level karakter; naik sendiri, membunuh paling cepat","-"]]),1))+
pane(2,box("Tips Umum",ol(["Stat modifikasi baju/senjata acak; bahan bagus tidak menaikkan level mod. Reroll bisa dilakukan setelah membangun Personal Communication Center.","Pakai bahan sampah untuk mod, simpan bahan terbaik untuk output utama.","Workstation Lv60 punya 1 slot tambahan, ganti yang level rendah (kecuali Fertilizer Board).","Selalu pakai pupuk: ladang flax penuh pupuk menghasilkan 7–12 flax.","Pelajari Cooking → Sashimi setelah skill maks, makanan paling hemat Energy.","Mulai Lv55, simpan material ber-buff untuk equipment (lihat Attribute Buff).","Pet sebelum Lv60: beli/tame banyak Male Megaloceros. Setelah 60: latih 1 Ornithomimus untuk tempur.","Cek Crafting Power di layar karakter untuk membuka resep dan bonus baru.","Ke Lava Island: satu bagian Firefighter Outfit (terutama Helmet) memberi imun Volcanic Storm.","Maksimalkan Animal Handling, tame/beli hewan sebanyak mungkin, lalu unlearn skill, hewan tetap terikat."]),1))+
pane(3,box("Lingkungan & Loot",tbl(["Biome","Catatan"],[["Tundra","Flax, Normal Ore, Log, Sap. Tempat utama gathering/mining/crafting"],["Snowfield","Rare Ore (Silver &amp; Gold), Mammoth (kulit &amp; tulang buff bagus)"],["Tropical","Tropical Flax, Gem Mine, Branchiosaurus, Rubber Tree. Maksimalkan resistance dulu"],["Swamp","Thick Vine, Mud, Swamp Bug, Lotus Cache (obat), Rubber Tree. Boss Apatosaurus terkuat"],["Savannah","Baobab Log (ringan), Lavender Cache (obat)"],["Desert","Tulang (Animal Graveyard), Boulder, Ankylosaurus, Utahraptor, Desert Algae"]]),1))+
pane(4,box("Pupuk & Dye",'<h3>Quality Fertilizer</h3>'+ul(["Charcoal → Vegetable Boost","Seashell → Fruit Boost","Bone → Grain Boost"])+'<h3>Fermented Fertilizer</h3>'+ul(["Fish → Wood Boost","Fruit → Leaf Boost","Seed → Fiber/Flax Boost","Grain → Flower Boost"])+'<h3>Dye</h3><p>Warna hasil = rata-rata color point outfit + color point dye, sehingga tidak persis sama dengan warna dye.</p><h3>Pure Black Dye</h3>'+ol(["Set A: 3 Cat Tail Flower normal, ambil warna tergelap, Dry 2x tiap bunga, jadikan dye (Alum Dye lebih hemat).","Set B: 1 Cat Tail Flower normal, Bleach 2x, lalu dye dengan Alum Dye Set A, hasilnya Pure Black Cat Tail Flower.","Set C: ulangi Set A–B sampai punya 3 Pure Black Cat Tail Flower, buat jadi 1 Pure Black Dye."]),1));

P.cooking=()=>"<h1>🍳 Memasak</h1><p class=sub>Angka 46 adalah peningkatan maksimal di level 60.</p>"+tabs(["Hidangan Utama","Kaldu, Saus &amp; Isian","Bumbu &amp; Topping","Panduan Chef"])+
pane(0,box("Hidangan Utama",tbl(["Hidangan","Stat dasar","Pilihan saus / kaldu / topping"],[["🍗 Ayam Pedas",chips("STR 46"),"Saus sayur DEX 46 · krim PER 46 · minyak WIL 46"],["🥘 Tteokbokki",chips("END 46"),"Saus sayur DEX 46 · krim PER 46 · minyak WIL 46"],["🍝 Mi Goreng",chips("INT 46"),"Saus sayur DEX 46 · krim PER 46 · minyak WIL 46"],["🍜 Mi Goreng Topping",chips("INT 46")+" + Skill Kemampuan","Saus sayur DEX 46 · krim PER 46 · minyak WIL 46"],["🍲 Mi",chips("INT 46"),"Kaldu tulang END 46 · daging STR 46 · ikan AGI 46 · sayur DEX 46"],["🎂 Cream Cake",chips("WIL 46 PER 46")+" + Skill Kemampuan","Isian: stat ability skill"],["🍕 Pizza",chips("WIL 46")+" + Skill Kemampuan","Daging STR 46 · sayur DEX 46 · buah CHA 46 · ikan AGI 46"],["🍇 Anggur Buah",chips("DEX 46 CHA 46"),"-"]]),1))+
pane(1,box("Kaldu, Saus &amp; Isian",tbl(["Resep","Jenis","Efek","Maks (Lv60)","Bahan"],[["Kaldu Tulang","Kaldu","END","46","Tulang"],["Kaldu Daging","Kaldu","STR","46","Daging"],["Kaldu Sayur","Kaldu","DEX","46","Sayur"],["Kaldu Ikan","Kaldu","AGI","46","Ikan"],["Saus Krim","Saus","PER","46","-"],["Saus Minyak","Saus","WIL","46","-"],["Saus Sayur","Saus","DEX","46","Sayur"],["Isian Daging","Isian","STR / skill Menambang","46 / 4","Daging"],["Isian Sayur","Isian","DEX","46","Sayur"],["Isian Buah","Isian","CHA","46","Buah"],["Isian Ikan","Isian","AGI","46","Ikan"]]),1))+
pane(2,'<div class="grid">'+box("🧂 Stat Bumbu",tbl(["Bumbu","Stat"],[["Madu &amp; Gula",chips("CHA +2 WIL +2 PER +2")],["Cabe",chips("STR +2 INT +2 END +2")],["Paprika",chips("STR +2 DEX +2 PER +2")],["Garam",chips("STR +2 PER +2")],["Herbal",chips("STR +2 AGI +2 WIL +2")]]))+box("🍕 Stat Topping",tbl(["Topping","Stat"],[["Buah",chips("CHA")],["Sayur",chips("DEX")],["Daging",chips("STR")],["Ikan",chips("AGI")]]))+box("⭐ Kemampuan Spesial Topping (+4)",tbl(["Topping","Kemampuan"],[["Daging","Tambang"],["Keju","Jagal"],["Keju Tua","Jagal &amp; Gather"],["Bawang","Gather"],["Tomat","Masak"],["Labu","Tani"],["Paprika","WPC"],["Cabe","Proses Logam"],["Kentang","Building"],["Kacang","Furniture Craft"],["Anggur","Jahit"],["Pisang","Proses"],["Ara","Armor Craft / Proses Kulit"]])+'<div class="note">Ikan, jamur, serangga, dan telur: tidak ada stat spesial.</div>')+"</div>")+
pane(3,box("🥖 Roti Isi Maksimal",ol(["Kukus Grain (butir padi) agar durasi buff lama.","Olah Grain menjadi Tepung.","BBQ Tepung dengan bumbu sesuai isi: daging → Garam, buah → Gula, serangga → Tanaman Obat.","Olah Tepung tadi menjadi Adonan Roti (sudah membawa buff semua proses).","Buat Roti Isi dengan isian sesuai bumbu.","Kukus kembali Roti Isi untuk durasi buff lebih lama."])+'<h3>Efek Bumbu</h3>'+tbl(["Bumbu","Boost"],[["Garam",chips("STR PER")],["Gula",chips("CHA PER DEX")],["Tanaman Obat",chips("STR AGI WIL")]])+'<div class="note">Flawless saat proses bumbu: level boost +1. Gosong/salah: level boost -1.</div>',1)+box("🐟 Makanan Energy Besar",ol(["Buat Ikan Mentah dari <b>Ikan Besar</b> (daging/kerang/ikan kecil hasilnya kurang bagus).","Pilih proses: <b>Kukus 2x</b> (mudah, kurang memuaskan), <b>Tumis 2x</b> (perlu minyak, memuaskan), atau <b>Goreng 2x</b> (perlu tepung, sangat memuaskan)."])+'<div class="note tip">Targetkan energy 250–280; lebih dari itu mubazir. Energy maksimal dengan Buff WIL hanya sekitar 310. Jika 1x proses sudah 250–280, tak perlu 2x.</div>',1))

'<div class="grid">'+JOBS.map(j=>'<div class="card f" data-g="'+j[2]+'"><h3>'+j[0]+" "+(JN[j[1]]||j[1])+"</h3><small>"+(GN[j[2]]||j[2])+"</small><p>Stat: "+(j[3]==="-"?"-":chips(j[3]))+"<br>Masakan: <b>"+j[4]+"</b><br>Saus/Kaldu/Bahan: "+j[5]+"<br>Bumbu &amp; alat: "+j[6]+"</p></div>").join("")+"</div>"+

P.buff=()=>"<h1>⚡ Buff &amp; Debuff Atribut</h1><p class=sub>"+BUFF.length+" atribut bahan. Hijau = langka, kuning = normal, abu-abu = debuff. Tanda - berarti belum ada angkanya. Nama atribut dipertahankan seperti di game agar mudah dicari.</p>"+fbar([["all","Semua"],["G","🟢 Hijau (Rare)"],["Y","🟡 Kuning"],["D","⚪ Debuff"]])+
tbl(["Tipe","Bahan","Atribut","Buff pada produk","Kategori","Per level","Keterangan"],BUFF.map(r=>[r[0],tm(r[1]),r[2],tt(r[3]),tm(r[4]),r[5]||'-',r[6]||'-'])).replace(/<tr class="f">/g,'<tr class="f">').split('<tr class="f">').map((x,i)=>i?'<tr class="f" data-g="'+BUFF[i-1][0]+'">'+x:x).join("").replace(/<td>([GYD])<\/td>/g,(m,t)=>'<td class="'+t+'">'+({G:"●",Y:"●",D:"●"})[t]+"</td>");

P.senjata=()=>"<h1>⚔️ Memilih Senjata</h1><p class=sub>Mekanik tempur bisa berubah, tanyakan clan setelah Lv60. Sebelum itu, Crossbow disarankan karena melatih Melee (Kick), Ranged, dan Defense (Roll).</p>"+

P.stat=()=>'<h1>📈 Stat</h1><p class=sub>Jumlah poin stat untuk tiap bonus. Contoh: setiap 5 STR memberi Serangan +1.</p>'+fbar([['all','Semua']].concat(ST.map(s=>[s[0],s[0]])))+'<div class=tbl><table><tr><th>Stat</th><th>Setiap</th><th>Manfaat</th></tr>'+ST.map(s=>s[1].map(x=>{const a=x.split('|');return '<tr class=f data-g='+s[0]+'><td>'+chips(s[0])+'</td><td>'+a[0]+' '+s[0]+'</td><td>'+a[1]+'</td></tr>'}).join('')).join('')+'</table></div><div class=note>Pemetaan Job ke Stat, Archetype, dan Kemampuan belum dimuat.</div>';
P.tani=()=>'<h1>🌾 Pertanian</h1><p class=sub>31 tanaman. Air dan Pupuk = kebutuhan per tanam, Hidup = peluang bertahan, Hasil = rentang panen menuju jumlah maksimal menurut sumber. Hasil sampingan (daun, kayu, dll.) dan resep pupuk belum dimuat.</p>'+fbar([['all','Semua'],['Buah','Buah'],['Biji-bijian','Biji-bijian'],['Sayur','Sayur'],['Bunga','Bunga'],['Serat','Serat'],['Daun','Daun']])+'<div class=tbl><table><tr><th>Tanaman</th><th>Jenis</th><th>Air</th><th>Pupuk</th><th>Waktu</th><th>Hidup</th><th>Hasil</th><th>Biome</th></tr>'+TANI.map(r=>'<tr class=f data-g='+r[1].split(', ')[0]+'>'+r.map((c,i)=>'<td>'+(i==6?'2–3 → '+c:c)+'</td>').join('')+'</tr>').join('')+'</table></div>';
